<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Question 2 - Retrieve and Display JSON Data</title>
</head>
<body>
  <h1>Book Information</h1>
  <div id="content"></div>
  <p id="errorMessage" style="color: red;"></p>

  <script>
    async function loadBooks() {
      const contentDiv = document.getElementById("content");
      const errorP = document.getElementById("errorMessage");

      try {
        const response = await fetch("books.json");
        if (!response.ok) {
          throw new Error("HTTP error! Status: " + response.status);
        }
        const data = await response.parse ? await response.parse() : await response.json();

        // (a) Title of the first book
        const firstTitle = document.createElement("p");
        firstTitle.textContent = "First Book Title: " + data.books[0].title;
        contentDiv.appendChild(firstTitle);

        // (b) Author of the second book
        const secondAuthor = document.createElement("p");
        secondAuthor.textContent = "Second Book Author: " + data.books[1].author;
        contentDiv.appendChild(secondAuthor);

        // (c) Genres of both books, clearly grouped by book title
        const genresHeading = document.createElement("h3");
        genresHeading.textContent = "Book Genres:";
        contentDiv.appendChild(genresHeading);

        const genresList = document.createElement("ul");
        data.books.forEach(book => {
          const li = document.createElement("li");
          li.textContent = book.title + " — " + book.genres.join(", ");
          genresList.appendChild(li);
        });
        contentDiv.appendChild(genresList);

      } catch (error) {
        errorP.textContent = "Failed to load book data: " + error.message;
      }
    }

    loadBooks();
  </script>
</body>
</html>
